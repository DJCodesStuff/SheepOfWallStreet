[project]
name = "sheep"
version = "0.1.0"
description = "Swing trading Trader + Reviewer for small accounts. Not financial advice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6",
    "streamlit>=1.66.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sheep"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
