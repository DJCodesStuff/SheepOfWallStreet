name: Daily Trader

on:
  schedule:
    # 22:15 UTC Mon-Fri = 17:15 New York in winter, 18:15 in summer: after the 16:30 bar cutoff.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trader
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - name: Run paper profiles
        run: uv run --no-dev python -m sheep.trader.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
