name: Daily Trader

# One job, two runs; sheep.trader.run picks what to do from the New York time.
# GitHub can start scheduled jobs late (sometimes by an hour), so both have slack built in.
on:
  schedule:
    # Open run: 14:45 UTC Mon-Fri = 09:45 New York in winter, 10:45 in summer. Enters at the
    # day's opening price; anything before 16:00 New York still counts.
    - cron: "45 14 * * 1-5"
    # Evening run: 22:15 UTC Mon-Fri = 17:15 New York in winter, 18:15 in summer: after the
    # 16:30 bar cutoff. Fills, closes trades, trails stops, queues exits.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trader
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - name: Run paper profiles
        run: uv run --no-dev python -m sheep.trader.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
